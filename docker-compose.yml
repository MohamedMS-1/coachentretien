services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: coach-postgres
    environment:
      POSTGRES_DB: coachdb
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coachdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: coach-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: