
spring.application.name=coach-entretien

# Ollama local
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Temps d'attente HTTP
spring.http.client.read-timeout=180s

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/coachdb
spring.datasource.username=coach
spring.datasource.password=coach123
spring.jpa.hibernate.ddl-auto=update

# pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
